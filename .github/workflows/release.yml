name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'tclasen/resume-skill' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a commit on main and a valid release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if [ "$REF_TYPE" = tag ]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python skills/resume/scripts/pins.py
      - name: Package tracked distribution files
        run: |
          mkdir dist
          git archive --format=tar --prefix=resume-skill/ HEAD skills/resume README.md SECURITY.md docs/supply-chain-security.md | gzip -n > dist/resume-skill.tar.gz
          cd dist
          sha256sum resume-skill.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution
          path: dist/
          if-no-files-found: error
          retention-days: 30

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-path: dist/resume-skill.tar.gz
      - name: Save portable provenance and verify identity
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cp "$BUNDLE_PATH" dist/resume-skill.sigstore.json
          gh attestation verify dist/resume-skill.tar.gz \
            --bundle dist/resume-skill.sigstore.json \
            --repo tclasen/resume-skill \
            --signer-workflow tclasen/resume-skill/.github/workflows/release.yml \
            --source-ref "$SOURCE_REF" --source-digest "$SOURCE_SHA" \
            --deny-self-hosted-runners
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attested-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attested-distribution
          path: dist
      - name: Upload all assets before publishing an immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "$RELEASE_TAG" \
            --notes 'Verify resume-skill.tar.gz with the accompanying Sigstore bundle as described in docs/supply-chain-security.md.' \
            dist/resume-skill.tar.gz dist/SHA256SUMS dist/resume-skill.sigstore.json
          gh release edit "$RELEASE_TAG" --draft=false
